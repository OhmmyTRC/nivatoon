services:
  - type: web
    name: nivatoon-web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build:web
    startCommand: npx next start -H 0.0.0.0 -p ${PORT:-10000}
    healthCheckPath: /api/notifications
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_OPTIONS
        value: --max-old-space-size=440 --no-deprecation
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: niva-421c2.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_DATABASE_URL
        value: https://niva-421c2-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: niva-421c2
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: niva-421c2.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "723356596295"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: nivatoonadmin@gmail.com
      - key: SMTP_PASS
        sync: false
