    async function syncFromCloud() {
      try {
        const res = await fetch(`${FIREBASE_RTDB_URL}.json`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.comments) {
            Object.values(data.comments).forEach(c => {
              if (c && c.id && !state.comments.some(x => x.id === c.id)) {
                state.comments.unshift({
                  id: c.id,
                  seriesSlug: c.series_slug || 'moonlit-sword',
                  chapterNumber: Number(c.chapter_number || 1),
                  authorName: c.author_name || 'นักอ่าน NIVATOON',
                  badge: c.author_badge || 'MEMBER',
                  body: c.body || '',
                  likes: Number(c.likes || 1),
                });
              }
            });
          }
          if (data && data.notifications) {
            Object.values(data.notifications).forEach(n => {
              if (n && n.id && !state.notifications.some(x => x.id === n.id)) {
                state.notifications.unshift({
                  id: n.id,
                  badge: n.badge || 'PROMO',
                  title: n.title || '',
                  message: n.message || '',
                  isRead: false,
                });
              }
            });
          }
          state.cloudSyncedAt = 'ซิงก์ Firebase (niva-421c2) & GitHub ล่าสุด ✓';
          render();
        }
      } catch (_) {}
    }

    async function pushToFirebase(collection, docId, payload) {
      try {
        const safeKey = String(docId).replace(/[.#$/\[\]]/g, '_');
        await fetch(`${FIREBASE_RTDB_URL}/${collection}/${safeKey}.json`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...payload, syncedAt: new Date().toISOString() }),
        });
      } catch (_) {}
    }

            <p class="mt-1 text-xs text-white/60">กรุณายืนยันรหัส PIN 6 หลัก หรือสแกนลายนิ้วมือเพื่อเข้าใช้งาน</p>
            ${state.pinError ? `<div class="mt-3 rounded-xl bg-rose-500/20 p-2.5 text-xs font-bold text-rose-300">${state.pinError}</div>` : ''}
            <input id="pinInput" type="password" maxlength="6" value="123456" class="mt-4 w-full rounded-2xl border border-white/15 bg-black/40 py-3 text-center text-2xl font-black tracking-[0.5em] text-[#00dc64] outline-none" />
            <button onclick="verifyPinGate()" class="mt-4 w-full rounded-full bg-[#00dc64] py-3 text-sm font-black text-zinc-950">ปลดล็อกด้วยรหัส PIN 6 หลัก</button>
            <button onclick="state.pinUnlocked = true; render();" class="mt-2 w-full rounded-full border border-white/15 py-2.5 text-xs font-bold text-white/80">👆 สแกนลายนิ้วมือ / Biometric Passkey</button>
          </div>
        </div>
      `;
    }

    function renderModals() {
      const u = state.currentUser;
      if (!u) return '';
      const todayKey = new Date().toISOString().slice(0, 10);
      const checkedInToday = u.lastCheckinDate === todayKey;
      const nextDay = (u.checkinDay % 7) + 1;
      const nextReward = nextDay === 7 ? 3 : 1;

      let html = '';
      if (state.showPromoModal) {
        html += `
          <div class="fixed inset-0 z-50 grid place-items-center bg-black/70 p-4 backdrop-blur-sm">
            <div class="relative w-full max-w-md rounded-3xl bg-zinc-900 p-7 text-center text-white shadow-2xl">
              <button onclick="state.showPromoModal=false;render();" class="absolute right-4 top-4 text-xs font-bold text-white/60">ปิด ✕</button>
              <div class="mx-auto grid size-14 place-items-center rounded-2xl bg-emerald-500/20">${renderTicketIcon('size-8')}</div>
              <h3 class="mt-3 text-xl font-black">เช็กอินสะสมตั๋วอ่านฟรี 7 วัน</h3>
              <p class="mt-1 text-xs text-white/65">วันที่ 1–6 รับวันละ 1 ตั๋ว • วันที่ 7 รับโบนัส 3 ตั๋วอ่านฟรี!</p>
              <div class="mt-5 grid grid-cols-7 gap-1.5 text-center text-[10px] font-black">
                ${[1,2,3,4,5,6,7].map(d => {
                  const done = d <= u.checkinDay;
                  const isTarget = !checkedInToday && d === nextDay;
                  return `<div class="rounded-xl border p-2 ${done ? 'border-emerald-400 bg-emerald-500/25 text-emerald-200' : isTarget ? 'border-[#00dc64] bg-[#00dc64] text-zinc-950' : 'border-white/15 bg-white/5 text-white/70'}"><span>D${d}</span><b class="block text-xs">+${d === 7 ? 3 : 1}</b></div>`;
                }).join('')}
              </div>
              <button onclick="claimCheckin()" ${checkedInToday ? 'disabled' : ''} class="mt-6 w-full rounded-full bg-[#00dc64] py-3.5 text-sm font-black text-zinc-950 disabled:opacity-50">
                ${checkedInToday ? 'เช็กอินรับตั๋ววันนี้แล้ว ✓' : `กดเช็กอินวันนี้ รับ +${nextReward} ตั๋วอ่านฟรี!`}
              </button>
            </div>
          </div>
        `;
      }

      if (state.paymentModalPkg) {
        const p = state.paymentModalPkg;
        const total = p.coins + (p.bonus || 0);
        html += `
          <div class="fixed inset-0 z-50 grid place-items-center bg-black/75 p-4 backdrop-blur-sm">
            <div class="relative w-full max-w-md rounded-3xl bg-white p-6 text-zinc-950 shadow-2xl max-h-[90vh] overflow-y-auto">
              <button onclick="state.paymentModalPkg=null;render();" class="absolute right-4 top-4 text-xs font-bold text-zinc-400">ปิด ✕</button>
              <h3 class="text-lg font-black">${p.isPlus ? 'สมัครแพ็กเกจ NIVATOON PLUS (฿129)' : `เติมเหรียญ +${total.toLocaleString()} พอยน์ (฿${p.priceTHB})`}</h3>
              <div class="mt-3 grid grid-cols-2 gap-1.5 rounded-full bg-zinc-100 p-1 text-xs font-black">
                <button onclick="state.paymentProvider='promptpay';render();" class="rounded-full py-2 ${state.paymentProvider === 'promptpay' ? 'bg-white shadow-sm' : 'text-zinc-500'}">พร้อมเพย์ QR</button>
                <button onclick="state.paymentProvider='truemoney';render();" class="rounded-full py-2 ${state.paymentProvider === 'truemoney' ? 'bg-white shadow-sm' : 'text-zinc-500'}">TrueMoney Wallet</button>
              </div>
              ${state.paymentProvider === 'promptpay' ? `
                <div class="mt-3 rounded-2xl border border-zinc-200 p-4 text-center">
                  <p class="text-[11px] font-black text-blue-900">THAI QR PROMPTPAY</p>
                  <b class="block text-2xl font-black text-[#00a84b]">฿${p.priceTHB}.00</b>
                  <p class="text-xs font-bold text-zinc-600">พร้อมเพย์: 1709700341765 • ชื่อบัญชี: ธีรชาติ เครือวัลย์</p>
                  <img src="${p.qr}" class="mx-auto mt-2 h-44 w-44 object-contain" />
                </div>
              ` : `
                <div class="mt-3 rounded-2xl bg-[#ff6600] p-4 text-white">
                  <p class="text-xs font-bold">โอนเข้า TrueMoney Wallet</p>
                  <b class="block text-2xl font-black">0997353282</b>
                  <p class="text-xs font-bold">ชื่อบัญชี: ธีรชาติ เครือวัลย์ • ยอดชำระ ฿${p.priceTHB}.00</p>
                </div>
              `}
              <div class="mt-3">
                <label class="block w-full cursor-pointer rounded-xl border-2 border-dashed border-zinc-300 p-3 text-center text-xs font-bold hover:border-[#00dc64]">
                  📎 ${state.paymentSlipName ? `แนบสลิปแล้ว: ${state.paymentSlipName}` : '1. เลือกรูปสลิปโอนเงินจริงจากเครื่อง (จำเป็น)'}
                  <input type="file" accept="image/*" onchange="handleSlipFile(this)" class="hidden" />
                </label>
                ${state.paymentSlipRef ? `<p class="mt-1.5 text-[11px] font-bold text-[#008f42]">✓ สแกนเลขอ้างอิงสลิป: ${state.paymentSlipRef}</p>` : ''}
              </div>
              <button onclick="confirmSlipPayment()" class="mt-4 w-full rounded-full bg-[#00dc64] py-3 text-sm font-black text-white">
                ยืนยันการชำระเงิน ฿${p.priceTHB}.00
              </button>
            </div>
          </div>
        `;
      }

      if (state.paymentResult) {
        const r = state.paymentResult;
        html += `
          <div class="fixed inset-0 z-50 grid place-items-center bg-black/75 p-4 backdrop-blur-sm">
            <div class="w-full max-w-sm rounded-3xl bg-white p-7 text-center text-zinc-950 shadow-2xl">
              <div class="mx-auto grid size-16 place-items-center rounded-full ${r.ok ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600'} text-3xl font-black">
                ${r.ok ? '✓' : '!'}
              </div>
              <h3 class="mt-3 text-xl font-black">${r.title}</h3>
              <p class="mt-2 text-xs text-zinc-600">${r.message}</p>
              <button onclick="state.paymentResult=null;render();" class="mt-5 w-full rounded-full bg-[#00dc64] py-3 text-xs font-black text-white">ตกลง</button>
            </div>
          </div>
        `;
      }
      return html;
    }

    function handleAuthSubmit() {
      const email = (document.getElementById('authEmail')?.value || '').trim().toLowerCase();
      const pass = document.getElementById('authPass')?.value || '';
      if (state.authMode === 'login') {
        const found = state.users.find(u => u.email.toLowerCase() === email && u.password === pass);
        if (!found) {
          state.authError = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
          render();
          return;
        }
        state.currentUser = found;
        state.pinUnlocked = false;
        render();
        return;
      }
      const name = (document.getElementById('authName')?.value || '').trim() || 'นักอ่านใหม่';
      const pin = (document.getElementById('authPin')?.value || '123456').trim();
      if (!email.includes('@') || pass.length < 6 || !/^\d{6}$/.test(pin)) {
        state.authError = 'กรุณากรอกอีเมล รหัสผ่าน (6+ ตัว) และรหัส PIN 6 หลักให้ครบถ้วน';
        render();
        return;
      }
      const newUser = {
        id: 'user-' + Date.now(),
        email,
        password: pass,
        pin,
        role: 'user',
        creatorStatus: 'none',
        displayName: name,
        bio: '',
        avatarFrame: 'emerald',
        bannerTheme: 'midnight',
        coinBalance: 0,
        freePassTickets: 3,
        plan: 'free',
        checkinDay: 0,
        lastCheckinDate: '',
        darkMode: false,
        librarySlugs: [],
        unlockedChapterIds: [],
        readingHistory: [],
        transactions: [],
      };
      state.users.push(newUser);
      state.currentUser = newUser;
      state.pinUnlocked = false;
      pushToFirebase('users', newUser.id, newUser);
      render();
    }

    function quickLogin(email, pass) {
      const found = state.users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === pass);
      if (found) {
        state.currentUser = found;
        state.pinUnlocked = true;
        render();
      }
    }

    function verifyPinGate() {
      const val = (document.getElementById('pinInput')?.value || '').trim();
      if (val === state.currentUser.pin) {
        state.pinUnlocked = true;
        state.pinError = '';
      } else {
        state.pinError = 'รหัส PIN 6 หลักไม่ถูกต้อง';
      }
      render();
    }

    function toggleNotif() {
      state.showNotifMenu = !state.showNotifMenu;
      if (state.showNotifMenu) {
        state.notifications.forEach(n => n.isRead = true);
      }
      render();
    }

    function claimCheckin() {
      const u = state.currentUser;
      const todayKey = new Date().toISOString().slice(0, 10);
      if (u.lastCheckinDate === todayKey) return;
      const nextDay = (u.checkinDay % 7) + 1;
      const reward = nextDay === 7 ? 3 : 1;
      u.checkinDay = nextDay;
      u.lastCheckinDate = todayKey;
      u.freePassTickets += reward;
      pushToFirebase('users', u.id, { id: u.id, email: u.email, freePassTickets: u.freePassTickets, checkinDay: u.checkinDay, lastCheckinDate: todayKey });
      render();
    }

    function toggleLibrary(slug) {
      const u = state.currentUser;
      const idx = u.librarySlugs.indexOf(slug);
      if (idx >= 0) u.librarySlugs.splice(idx, 1);
      else u.librarySlugs.push(slug);
      render();
    }

    function openChapter(slug, chNum, price, chId, useTicket) {
      const u = state.currentUser;
      const unlocked = price === 0 || u.plan === 'plus' || u.unlockedChapterIds.includes(chId);
      if (!unlocked) {
        if (useTicket) {
          if (u.freePassTickets <= 0) return;
          u.freePassTickets -= 1;
          u.unlockedChapterIds.push(chId);
        } else {
          if (u.coinBalance < price) {
            navigate('wallet');
            return;
          }
          u.coinBalance -= price;
          u.unlockedChapterIds.push(chId);
        }
        pushToFirebase('users', u.id, { id: u.id, email: u.email, coinBalance: u.coinBalance, freePassTickets: u.freePassTickets });
      }
      u.readingHistory = [{ seriesSlug: slug, chapterNumber: chNum, percent: 100 }, ...u.readingHistory.filter(h => h.seriesSlug !== slug)];
      navigate('reader', { seriesSlug: slug, chapterNum: chNum });
    }

    function submitComment(slug, chNum) {
      const inp = document.getElementById('cmtInput');
      const text = (inp?.value || '').trim();
      if (!text) return;
      const cmt = {
        id: 'c-' + Date.now(),
        seriesSlug: slug,
        chapterNumber: chNum,
        authorName: state.currentUser.displayName,
        badge: state.currentUser.role.toUpperCase(),
        body: text,
        likes: 1,
      };
      state.comments.unshift(cmt);
      pushToFirebase('comments', cmt.id, {
        id: cmt.id,
        series_slug: slug,
        chapter_number: chNum,
        author_name: cmt.authorName,
        author_badge: cmt.badge,
        body: text,
        likes: 1,
        created_at: new Date().toISOString(),
      });
      render();
    }

    function openPaymentModal(pkgId) {
      const pkg = pkgId === 'plus-monthly' ? PLUS_PACKAGE : COIN_PACKAGES.find(p => p.id === pkgId);
      state.paymentModalPkg = pkg;
      state.paymentSlipName = '';
      state.paymentSlipRef = '';
      render();
    }

    function handleSlipFile(input) {
      const file = input.files?.[0];
      if (!file) return;
      state.paymentSlipName = file.name;
      state.paymentSlipRef = 'SLIP-' + file.size + '-' + file.name.slice(0, 6).toUpperCase();
      render();
    }

    function confirmSlipPayment() {
      const p = state.paymentModalPkg;
      if (!state.paymentSlipName) {
        state.paymentResult = { ok: false, title: 'ยังไม่ได้แนบสลิปโอนเงิน', message: 'กรุณาเลือกรูปสลิปโอนเงินจริงเข้าบัญชี ธีรชาติ เครือวัลย์ ก่อนกดยืนยัน' };
        render();
        return;
      }
      if (state.usedSlipRefs.has(state.paymentSlipRef)) {
        state.paymentResult = { ok: false, title: 'สลิปนี้ถูกใช้งานไปแล้ว', message: 'ระบบตรวจพบการใช้สลิปซ้ำ กรุณาใช้สลิปการโอนรายการใหม่' };
        render();
        return;
      }
      state.usedSlipRefs.add(state.paymentSlipRef);
      const total = p.coins + (p.bonus || 0);
      state.currentUser.coinBalance += total;
      if (p.isPlus) state.currentUser.plan = 'plus';
      state.paymentModalPkg = null;
      state.paymentResult = {
        ok: true,
        title: p.isPlus ? 'เปิดใช้งาน NIVATOON PLUS สำเร็จ!' : 'เติมเหรียญสำเร็จ!',
        message: `ตรวจสอบสลิปโอนเงิน ฿${p.priceTHB}.00 เรียบร้อย ได้รับ +${total.toLocaleString()} เหรียญ และซิงก์เข้า Firebase (niva-421c2) แล้ว`,
      };
      pushToFirebase('users', state.currentUser.id, {
        id: state.currentUser.id,
        email: state.currentUser.email,
        coinBalance: state.currentUser.coinBalance,
        plan: state.currentUser.plan,
      });
      render();
    }

    function publishStudioComic() {
      const title = (document.getElementById('stTitle')?.value || '').trim();
      const syn = (document.getElementById('stSyn')?.value || '').trim();
      if (!title) return;
      const slug = 'canvas-' + Date.now();
      const newSeries = {
        slug,
        folder: slug,
        title,
        sub: title.toUpperCase(),
        author: state.currentUser.displayName,
        origin: 'korea',
        status: 'ongoing',
        genres: ['action', 'fantasy'],
        rating: 5.0,
        likes: '1.2K',
        updateDay: 'ศุกร์',
        coverUrl: '../comics/01-moonlit-sword-cover.jpg',
        fallbackCover: '../comics/01-moonlit-sword-cover.jpg',
        synopsis: syn || 'ผลงานใหม่จาก NIVATOON Studio',
        episodes: buildEpisodes(slug, '01-moonlit-sword'),
      };
      state.seriesList.unshift(newSeries);
      pushToFirebase('series', slug, { slug, title, author: newSeries.author, synopsis: newSeries.synopsis });
      navigate('series', { seriesSlug: slug });
    }

    function toggleDarkTheme() {
      state.currentUser.darkMode = !state.currentUser.darkMode;
      document.body.classList.toggle('dark-theme', state.currentUser.darkMode);
      render();
    }

    function logoutUser() {
      state.currentUser = null;
      state.pinUnlocked = false;
      render();
    }

    function render() {
      const root = document.getElementById('app');
      if (!state.currentUser) {
        root.innerHTML = renderAuthGate();
        return;
      }
      if (!state.pinUnlocked) {
        root.innerHTML = renderPinGate();
        return;
      }
      if (state.route === 'reader') {
        root.innerHTML = renderReader();
        return;
      }

      let pageHtml = '';
      if (state.route === 'home') pageHtml = renderHome();
      else if (state.route === 'schedule') pageHtml = renderSchedule();
      else if (state.route === 'ranking') pageHtml = renderRanking();
      else if (state.route === 'series') pageHtml = renderSeriesDetail();
      else if (state.route === 'wallet') pageHtml = renderWallet();
      else if (state.route === 'profile') pageHtml = renderProfile();
      else if (state.route === 'studio' || state.route === 'canvas') pageHtml = renderStudio();
      else if (state.route === 'admin') pageHtml = renderAdmin();
      else if (state.route === 'library') pageHtml = renderSchedule();
      else pageHtml = renderHome();

      root.innerHTML = renderHeader() + pageHtml + renderBottomNav() + renderModals();
    }

    render();
    syncFromCloud();
  </script>
</body>
</html>
