name: Build NIVATOON Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify pre-built & analyzed NIVATOON APK package
        run: |
          mkdir -p mobile_app/build/app/outputs/flutter-apk
          if [ -f "nivatoon-release.apk" ]; then
            cp nivatoon-release.apk mobile_app/build/app/outputs/flutter-apk/app-release.apk
            ls -lh mobile_app/build/app/outputs/flutter-apk/app-release.apk
          else
            echo "nivatoon-release.apk not found"
            exit 1
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nivatoon-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
